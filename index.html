<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="rdtscx 静态站点导航页：只提供站点入口，不展示任何仓库信息。">
<script>
/* 主题完全跟随系统：只读 prefers-color-scheme，读不到时用日间模式 */
(function(){
  var dark = false;
  try{
    dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }catch(e){ dark = false; }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<title>导航 · rdtscx 静态站点</title>
<style>
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --panel2:#fbfcfd;
  --line:#e6e9ef;
  --line2:#eef1f5;
  --text:#1e2733;
  --muted:#5f6b7a;
  --dim:#8d97a5;
  --accent:#3f6fd8;
  --accent-soft:#eef3fd;
  --shadow:0 1px 2px rgba(31,45,66,.03);
  --shadow-up:0 6px 18px rgba(24,38,63,.08);
  --ease:cubic-bezier(.22,.9,.3,1);
}
html[data-theme="dark"]{
  --bg:#0f1319;
  --panel:#151b23;
  --panel2:#1a212b;
  --line:#232b36;
  --line2:#1e2631;
  --text:#e6ebf2;
  --muted:#9aa7b8;
  --dim:#6b7889;
  --accent:#7aa2f7;
  --accent-soft:rgba(122,162,247,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-up:0 8px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-behavior:smooth}
body{
  margin:0;line-height:1.62;color:var(--text);background:var(--bg);
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .24s var(--ease), color .24s var(--ease);
}
a{color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  transition:box-shadow .2s var(--ease), border-color .2s;
}
html[data-theme="dark"] .topbar{background:rgba(17,22,29,.86)}
.topbar.scrolled{box-shadow:var(--shadow-up)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;min-height:53px}
.brand{display:flex;align-items:center;min-width:0}
.brand > * + *{margin-left:10px}
.logo{
  width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  font-weight:700;font-size:11px;display:grid;place-items:center;letter-spacing:.5px;
  border:1px solid var(--accent-soft);flex-shrink:0;
}
.brand strong{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;color:var(--dim);font-size:10.5px}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 布局 ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:20px 22px 56px}
.sec-head{display:flex;align-items:center;margin:22px 0 10px}
.sec-head h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.005em}

.index{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.entry{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-top:1px solid var(--line2);text-decoration:none;
  transition:background .16s,transform .14s var(--ease);
}
.entry:first-child{border-top:0}
.entry:hover{background:var(--panel2)}
.entry:active{transform:scale(.997)}
.entry:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--panel2)}
.entry-main{min-width:0;display:block;margin-right:16px}
.entry-title{display:block;font-size:14.5px;font-weight:600;color:var(--text);letter-spacing:.005em;word-break:break-word}
.entry-desc{
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;
}
.entry-right{display:flex;align-items:center;flex-shrink:0}
.entry-right > * + *{margin-left:10px}
.tag{font-size:9.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.tag.site{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft)}
.chev{width:7px;height:7px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg);margin:0 5px;transition:transform .2s var(--ease),border-color .2s;flex-shrink:0}
.entry:hover .chev{transform:rotate(45deg) translate(2px,-2px);border-color:var(--accent)}

footer{color:var(--dim);font-size:10.5px;margin-top:28px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:3px 0}

@media (max-width:760px){
  .topbar-inner{padding:8px 12px}
  .brand small{display:none}
  .wrap{padding:14px 12px 44px}
  .entry{padding:12px 14px}
}
@media (max-width:560px){
  .entry-right .tag{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .entry,.topbar{transition:none!important}
}
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">R</span>
      <div><strong>导航</strong><small>站点索引</small></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="sec-head">
    <h2>站点入口</h2>
  </div>

  <nav class="index" aria-label="站点入口">
    <a class="entry" href="tariff/">
      <span class="entry-main">
        <span class="entry-title">资费监控</span>
        <span class="entry-desc">中国移动 / 电信 / 联通 / 广电资费监控与查询，含全国与各省数据。</span>
      </span>
      <span class="entry-right">
        <span class="tag site">站点</span>
        <i class="chev" aria-hidden="true"></i>
      </span>
    </a>
    <a class="entry" href="arpu/">
      <span class="entry-main">
        <span class="entry-title">ARPU 查询</span>
        <span class="entry-desc">号码 ARPU 查询页面。</span>
      </span>
      <span class="entry-right">
        <span class="tag site">站点</span>
        <i class="chev" aria-hidden="true"></i>
      </span>
    </a>
  </nav>

  <footer>
    <p>rdtscx · GitHub Pages 静态站点</p>
  </footer>
</main>

<script>
/* 顶栏滚动阴影（页面为纯静态导航） */
(function(){
  var topbar = document.getElementById('topbar');
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      topbar.classList.toggle('scrolled', window.scrollY > 4);
      ticking = false;
    });
  }, { passive: true });
})();
</script>
</body>
</html>
