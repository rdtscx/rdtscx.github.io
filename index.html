<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
/* 主题完全跟随系统：只读 prefers-color-scheme，读不到时用日间模式 */
(function(){
  var dark = false;
  try{
    dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }catch(e){ dark = false; }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  try{ localStorage.removeItem('rdtscx.theme'); }catch(e){}   // 旧版手动主题开关的残留
})();
</script>
<title>rdtscx</title>
<style>
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --panel2:#fbfcfd;
  --line:#e6e9ef;
  --line2:#eef1f5;
  --text:#1e2733;
  --muted:#5f6b7a;
  --dim:#8d97a5;
  --accent:#3f6fd8;
  --accent-soft:#eef3fd;
  --ok:#16a34a;
  --shadow:0 1px 2px rgba(31,45,66,.03);
  --shadow-up:0 6px 18px rgba(24,38,63,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --topbar-h:53px;
  --ease:cubic-bezier(.22,.9,.3,1);
}
html[data-theme="dark"]{
  --bg:#0f1319;
  --panel:#151b23;
  --panel2:#1a212b;
  --line:#232b36;
  --line2:#1e2631;
  --text:#e6ebf2;
  --muted:#9aa7b8;
  --dim:#6b7889;
  --accent:#7aa2f7;
  --accent-soft:rgba(122,162,247,.14);
  --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-up:0 8px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + 12px)}
body{
  margin:0;line-height:1.62;color:var(--text);background:var(--bg);
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .24s var(--ease), color .24s var(--ease);
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  transition:box-shadow .2s var(--ease), border-color .2s;
}
html[data-theme="dark"] .topbar{background:rgba(17,22,29,.86)}
.topbar.scrolled{box-shadow:var(--shadow-up)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;min-height:var(--topbar-h)}
.topbar-inner > * + *{margin-left:12px}
.brand{display:flex;align-items:center;min-width:150px;flex-shrink:0}
.brand > * + *{margin-left:10px}
.logo{
  width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  font-weight:700;font-size:11px;display:grid;place-items:center;letter-spacing:.5px;
  border:1px solid var(--accent-soft);flex-shrink:0;
  transition:transform .2s var(--ease);
}
.brand:hover .logo{transform:rotate(-6deg) scale(1.04)}
.brand strong{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;color:var(--dim);font-size:10.5px}
/* 仓库连接状态灯：连接中灰闪、已连接绿、断开红 */
.status{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-left:7px;vertical-align:1px;background:var(--dim);
  transition:background .2s var(--ease),box-shadow .2s var(--ease);
}
.status.ok{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.status.err{background:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.16)}
.status.wait{background:var(--dim);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.tools{margin-left:auto;display:flex;align-items:center;min-width:0}
.search{
  position:relative;display:flex;align-items:center;
  border:1px solid var(--line);background:var(--panel2);border-radius:9px;
  transition:border-color .16s, box-shadow .16s, background .16s;
}
.search:focus-within{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:14px;height:14px;margin-left:9px;color:var(--dim);flex-shrink:0}
.search input{
  font:inherit;font-size:12.5px;color:var(--text);background:none;border:0;outline:0;
  padding:7px 4px 7px 6px;width:min(38vw,220px);min-width:0;
}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 4px;margin-right:7px;line-height:1.5;
}
.search.filled kbd{display:none}
.clear{
  display:none;border:0;background:none;color:var(--dim);cursor:pointer;
  font-size:15px;line-height:1;padding:0 8px 1px;border-radius:6px;
}
.search.filled .clear{display:block}
.clear:hover{color:var(--text);background:var(--line2)}
/* 统一焦点环：键盘可达，鼠标点按不出现刺眼的默认框 */
.chip:focus-visible,.sort:focus-visible,.copy:focus-visible,.clear:focus-visible,.state button:focus-visible,.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus:not(:focus-visible),select:focus:not(:focus-visible){outline:none}

/* ---------- 布局 ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:20px 22px 56px}
a{color:inherit}


.sec-head{display:flex;align-items:center;flex-wrap:wrap;margin:22px 0 10px}
.sec-head > * + *{margin-left:12px}
.sec-head h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.005em;flex-shrink:0}
.sec-head .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;margin-bottom:-6px}
.chips > *{margin-bottom:6px}
.chips > * + *{margin-left:6px}
.chip{
  font:inherit;font-size:11px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;
  transition:color .15s,background .15s,border-color .15s,transform .12s var(--ease);
}
.chip:hover{color:var(--text);border-color:var(--accent-soft)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft)}
.chip b{font-weight:600;opacity:.75;margin-left:3px}
.sort{
  font:inherit;font-size:11px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.sort:hover{color:var(--text);border-color:var(--accent-soft)}
.count{font-size:10.5px;color:var(--dim);font-family:var(--mono);white-space:nowrap;font-weight:400;margin-left:7px}
.chips-row{display:flex;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.chips-row > * + *{margin-left:8px}

/* ---------- 列表 ---------- */
.index{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.entry{
  border-top:1px solid var(--line2);
  transition:background .16s;
  animation:rise .34s var(--ease) both;
  animation-delay:calc(var(--i,0) * 26ms);
  cursor:pointer;
}
.entry:first-child{border-top:0}
.entry:hover{background:var(--panel2)}
.entry-row{display:flex;align-items:center;justify-content:space-between;padding:13px 18px}
.entry-main{min-width:0;flex:1;display:block;margin-right:16px;text-decoration:none;color:inherit}
.entry-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.entry-main-inner{display:block;min-width:0}
/* 软件版本下载行：版本号直接点击下载对应文件 */
.verrow{display:flex;flex-wrap:wrap;align-items:center;padding:0 18px 13px}
.verrow .vlabel{font-size:10.5px;color:var(--dim);font-family:var(--mono);margin-right:9px}
.ver{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:7px;padding:2px 8px;margin:3px 6px 0 0;text-decoration:none;transition:background .15s,color .15s,transform .12s var(--ease),border-color .15s}
.ver:hover{background:var(--accent);color:#fff}
.ver:active{transform:scale(.94)}
.ver:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ver.latest{font-weight:600}
.ver .vsize{opacity:.72;margin-left:5px;font-size:9.5px}
.ver:hover .vsize{opacity:.9}
html[data-theme="dark"] .ver:hover{color:#0f1319}
.entry-title{display:block;font-size:14.5px;font-weight:600;color:var(--text);letter-spacing:.005em;word-break:break-word}
.entry-desc{
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;
}
.entry-right{display:flex;align-items:center;flex-shrink:0}
.entry-right > * + *{margin-left:10px}
.tag{font-size:9.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.tag.site{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft)}
.tag.app{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft)}
.meta{display:inline-flex;align-items:center;font-size:10.5px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.meta .lang-dot{margin-right:5px}
.ago{font-size:10.5px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.lang-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0}
.path{
  font-family:var(--mono);font-size:10.5px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;
}
/* 复制按钮：默认隐形，悬停/聚焦/触屏常显 */
.copy{
  width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;
  border:1px solid transparent;border-radius:7px;background:none;color:var(--muted);
  cursor:pointer;opacity:0;transform:scale(.92);
  transition:opacity .16s,transform .16s var(--ease),color .16s,background .16s,border-color .16s;
}
.entry:hover .copy,.entry:focus-within .copy,.copy:focus-visible{opacity:1;transform:none}
.copy:hover{color:var(--text);background:var(--panel);border-color:var(--line)}
.copy:active{transform:scale(.88)}
.copy svg{width:13px;height:13px}
.copy .i-done{display:none;color:var(--ok)}
.copy.done{color:var(--ok);opacity:1}
.copy.done .i-copy{display:none}
.copy.done .i-done{display:block;animation:pop .22s var(--ease)}
.chev{width:7px;height:7px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg);margin:0 5px;transition:transform .2s var(--ease),border-color .2s;flex-shrink:0}
.entry:hover .chev{transform:rotate(45deg) translate(2px,-2px);border-color:var(--accent)}

/* 骨架屏 */
.skel{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-top:1px solid var(--line2)}
.skel-main{margin-right:16px}
.skel:first-child{border-top:0}
.skel-main{flex:1;min-width:0}
.skel-line{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--line2) 25%,var(--line) 37%,var(--line2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite}
.skel-line.w1{width:38%;margin-bottom:8px}
.skel-line.w2{width:72%}
.skel-pill{width:70px;height:18px;border-radius:999px;background:var(--line2)}

/* 状态 */
.state{display:flex;align-items:center;flex-wrap:wrap;padding:18px;color:var(--dim);font-size:12px}
.state > * + *{margin-left:10px}
.state button{
  font:inherit;font-size:11.5px;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .12s var(--ease);
}
.state button:hover{border-color:var(--accent-soft);background:var(--panel2)}
.state button:active{transform:scale(.96)}
.note{margin:8px 0 0;font-size:10.5px;color:var(--dim)}

footer{color:var(--dim);font-size:10.5px;margin-top:28px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:3px 0}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);transition:color .15s,border-color .15s}
footer a:hover{color:var(--accent);border-bottom-color:var(--accent-soft)}
.note kbd{font-family:var(--mono);font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 3px;margin:0 1px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,14px);
  padding:9px 14px;border-radius:10px;font-size:12px;
  background:#1e2733;color:#fff;box-shadow:0 8px 24px rgba(12,20,32,.28);
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .24s var(--ease);
  max-width:min(520px,90vw);text-align:center;
}
html[data-theme="dark"] .toast{background:#e6ebf2;color:#11161d}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{transform:translateY(6px)}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.35)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

@media (hover:none){
  .copy{opacity:1;transform:none}     /* 触屏没有 hover，常显复制按钮 */
}
@media (min-width:1500px){
  .topbar-inner,.wrap{max-width:1440px}
}
@media (max-width:760px){
  .topbar-inner{padding:8px 12px}
  .brand{min-width:0}
  .brand small{display:none}
  .search input{width:min(34vw,150px)}
  .wrap{padding:14px 12px 44px}
  .entry-row{padding:12px 14px}
  .verrow{padding:0 14px 12px}
  .entry-right > * + *{margin-left:7px}
  .sec-head > * + *{margin-left:8px}
}
@media (max-width:560px){
  .path{display:none}
  .search kbd{display:none}
  .entry-right .meta{display:none}   /* 小屏优先保留站点标签与操作按钮 */
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .entry,.copy.done .i-done,.skel-line,.status{animation:none!important}
  .entry,.copy,.chip,.state button,.toast,.topbar,.logo{transition:none!important}
}
</style>
</head>

<header class="topbar" id="topbar">

      </div>

</header>

<main class="wrap">

    <span class="grow"></span>
    <select class="sort" id="sort" aria-label="排序方式">
      <option value="pushed">最近推送</option>
      <option value="name">名称 A-Z</option>

  </div>
  <div class="chips-row">

      <button class="chip" type="button" data-filter="all" aria-pressed="true">全部 <b id="c-all"></b></button>

      <button class="chip" type="button" data-filter="repo" aria-pressed="false">仅仓库 <b id="c-repo"></b></button>
    </div>
  </div>

  <div class="index" id="repo-index"></div>

  <noscript><div class="state">仓库索引需要启用 JavaScript，可直接访问 <a href="https://github.com/rdtscx?tab=repositories">GitHub 仓库列表</a>。</div></noscript>
  <p class="note">按 <kbd>/</kbd> 搜索，<kbd>↑</kbd><kbd>↓</kbd> 选择，<kbd>Enter</kbd> 打开；每个条目可一键复制链接。</p>

  <footer>
    <p>rdtscx · GitHub Pages 静态站点</p>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

function setLink(s) {
  if (!linkDot) return;
  linkDot.className = 'status ' + s;
  linkDot.title = LINK_TEXT[s] || '';
  linkDot.setAttribute('aria-label', LINK_TEXT[s] || '');
  /* 部分内核在元素创建后动态切 class 时不重算样式，导致颜色不变；
     状态灯同时写内联值，保证绿/红一定生效 */
  linkDot.style.background = LINK_BG[s] || '';
  linkDot.style.boxShadow = LINK_RING[s] || '';
  /* 个别 WebView 内核对已存在节点改 class/内联样式后不立即重绘，
     一次同步的隐藏→读布局→恢复可强制刷新，避免状态灯颜色滞留在旧值 */
  var _disp = linkDot.style.display;
  linkDot.style.display = 'none';
  void linkDot.offsetWidth;
  linkDot.style.display = _disp;
}

const state = { repos: [], q: '', filter: 'all', sort: 'pushed', focus: -1 };

/* ---------- 小工具 ---------- */
const make = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

const LANG_COLORS = {
  JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Go: '#00ADD8',
  Rust: '#dea584', Java: '#b07219', Kotlin: '#A97BFF', HTML: '#e34c26',
  CSS: '#563d7c', Shell: '#89e051', PHP: '#4F5D95', C: '#555555', 'C++': '#f34b7d',
};
const langColor = (lang) => LANG_COLORS[lang] || 'var(--dim)';

const pad2 = (n) => (n < 10 ? '0' : '') + n;
const fmtSize = (b) => {
  if (!b || b < 0) return '';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
};
const fmtAgo = (iso) => {
  const t = Date.parse(iso);
  if (isNaN(t)) return '—';
  const diff = (Date.now() - t) / 1000;
  if (diff < 60) return '1 分钟内';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  if (diff < 86400 * 365) return Math.floor(diff / (86400 * 30)) + ' 个月前';
  return Math.floor(diff / (86400 * 365)) + ' 年前';
};
const fmtStamp = (iso) => {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
         ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
};

const nextUrl = (link) => {
  if (!link) return null;
  const m = link.match(/<([^>]+)>\s*;\s*rel="next"/);
  return m ? m[1] : null;
};

/* ---------- 主题（只读系统偏好，不提供手动切换） ---------- */
(function watchSystemTheme() {
  if (!window.matchMedia) return;   // 读不到就保持日间模式
  const apply = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = (e) => apply(!!e.matches);
  // 旧内核只有 addListener
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
})();

/* ---------- 数据 ---------- */
function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.repos) || !obj.ts) return null;
    if (Date.now() - obj.ts > CACHE_TTL) return null;
    return obj.repos;
  } catch (e) { return null; }
}

function writeCache(repos) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), repos }));
  } catch (e) {}
}

async function fetchRepos() {
  const all = [];
  let url = ENDPOINT;
  for (let page = 0; url && page < 10; page++) {
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const batch = await res.json();
    if (!Array.isArray(batch)) throw new Error('响应格式异常');
    all.push(...batch);
    url = nextUrl(res.headers.get('Link'));
  }
  return all.filter((r) => r.name.toLowerCase() !== USER + '.github.io');
}

/* 合并清单收录的外部条目：与账号仓库同名时以账号仓库为准 */
function mergeExtra(repos) {
  const names = new Set(repos.map((r) => r.name));
  const extra = EXTRA.filter((e) => !names.has(e.name)).map((e) => ({
    name: e.name,
    description: e.description || '',
    has_pages: true,
    pushed_at: e.pushed_at || '',
    stargazers_count: 0,
    language: e.language || '',
    fork: false,
    archived: false,
    ext_url: e.url || '',
  }));
  return repos.concat(extra);
}

/* ---------- 渲染 ---------- */
function skeletons(n) {
  box.textContent = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const row = make('div', 'skel');
    row.style.setProperty('--i', i);
    const main = make('div', 'skel-main');
    main.appendChild(make('div', 'skel-line w1'));
    main.appendChild(make('div', 'skel-line w2'));
    row.appendChild(main);
    row.appendChild(make('div', 'skel-pill'));
    frag.appendChild(row);
  }
  box.appendChild(frag);
}

function visible() {
  const q = state.q.trim().toLowerCase();
  let list = state.repos.filter((r) => {
    const isApp = !!APPINFO[r.name];
    if (state.filter === 'pages' && (!r.has_pages || isApp)) return false;
    if (state.filter === 'app' && !isApp) return false;
    if (state.filter === 'repo' && (r.has_pages || isApp)) return false;
    if (!q) return true;
    return (r.name || '').toLowerCase().includes(q) ||
           (r.description || '').toLowerCase().includes(q) ||
           (r.language || '').toLowerCase().includes(q);
  });
  const cmp = {
    pushed: (a, b) => String(b.pushed_at || '').localeCompare(String(a.pushed_at || '')),
    name: (a, b) => String(a.name).localeCompare(String(b.name), 'zh-Hans-CN'),
    stars: (a, b) => (b.stargazers_count || 0) - (a.stargazers_count || 0) ||
                     String(b.pushed_at || '').localeCompare(String(a.pushed_at || '')),
  }[state.sort];
  return list.sort(cmp);
}

function linkFor(repo) {
  /* 清单收录的外部站点用 ext_url；账号仓库指向其站点页面（/<repo>/） */
  if (repo.ext_url) return { href: repo.ext_url, label: repo.ext_url.replace(/^https?:\/\//, ''), pages: true };
  return { href: '/' + encodeURIComponent(repo.name) + '/', label: '/' + repo.name + '/', pages: repo.has_pages };
}

function entry(repo, idx) {
  const target = linkFor(repo);
  const info = APPINFO[repo.name] || null;
  const wrap = make('div', 'entry');
  wrap.style.setProperty('--i', Math.min(idx, 12));

  const a = make('a', 'entry-main');
  a.href = target.href;
  if (target.pages) a.setAttribute('aria-label', repo.name + ' 站点');

  const row = make('div', 'entry-row');

  const main = make('span', 'entry-main-inner');
  main.appendChild(make('span', 'entry-title', repo.name));
  main.appendChild(make('span', 'entry-desc', repo.description || '暂无描述'));
  a.appendChild(main);
  row.appendChild(a);

  const right = make('span', 'entry-right');
  if (info) right.appendChild(make('span', 'tag app', '软件'));
  else if (target.pages) right.appendChild(make('span', 'tag site', '站点'));
  if (repo.fork) right.appendChild(make('span', 'tag', 'Fork'));
  if (repo.archived) right.appendChild(make('span', 'tag', '已归档'));
  if (repo.language) {
    const meta = make('span', 'meta');
    const dot = make('i', 'lang-dot');
    dot.style.background = langColor(repo.language);
    meta.appendChild(dot);
    meta.appendChild(document.createTextNode(repo.language));
    right.appendChild(meta);
  }
  if (repo.stargazers_count > 0) {
    const st = make('span', 'meta', '★ ' + repo.stargazers_count);
    st.title = 'Star 数';
    right.appendChild(st);
  }
  const ago = document.createElement('time');
  ago.className = 'ago';
  ago.dataset.ts = repo.pushed_at || '';
  if (repo.pushed_at) ago.setAttribute('datetime', repo.pushed_at);
  ago.title = '最近推送 ' + fmtStamp(repo.pushed_at);
  ago.appendChild(make('span', 'ago-label', '更新于 '));
  ago.appendChild(document.createTextNode(fmtAgo(repo.pushed_at)));
  right.appendChild(ago);
  const path = make('code', 'path', target.label);
  path.title = new URL(target.href, location.href).href;
  right.appendChild(path);

  const copy = make('button', 'copy');
  copy.type = 'button';
  copy.title = '复制链接';
  copy.setAttribute('aria-label', '复制 ' + repo.name + ' 的链接');
  copy.innerHTML =
    '<svg class="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>' +
    '<svg class="i-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>';
  copy.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const url = new URL(target.href, location.href).href;
    const done = () => {
      copy.classList.add('done');
      toast('已复制链接');
      setTimeout(() => copy.classList.remove('done'), 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
    } else {
      fallbackCopy(url, done);
    }
  });
  right.appendChild(copy);
  right.appendChild(make('i', 'chev'));
  row.appendChild(right);
  wrap.appendChild(row);

  return wrap;
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  ok ? done() : toast('复制失败，请手动选择');
}

function render() {
  const list = visible();
  box.textContent = '';
  state.focus = -1;
  countEl.textContent = list.length + ' / ' + state.repos.length + ' 个';

  if (!list.length) {
    const state_ = make('div', 'state');
    state_.appendChild(make('span', '', state.repos.length ? '没有匹配的仓库' : '没有可展示的公开仓库'));
    if (state.repos.length) {
      const btn = make('button', '', '清除筛选');
      btn.type = 'button';
      btn.addEventListener('click', resetFilters);
      state_.appendChild(btn);
    }
    box.appendChild(state_);
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach((repo, i) => frag.appendChild(entry(repo, i)));
  box.appendChild(frag);
}

function stats(repos) {
  const apps = repos.filter((r) => APPINFO[r.name]).length;
  const pages = repos.filter((r) => r.has_pages && !APPINFO[r.name]).length;
  document.getElementById('c-all').textContent = repos.length;
  document.getElementById('c-pages').textContent = pages;
  document.getElementById('c-app').textContent = apps;
  document.getElementById('c-repo').textContent = repos.length - pages - apps;
}

/* 相对时间每分钟重算一次，避免长时间停留后时间停在旧值 */
function tickAgo() {
  box.querySelectorAll('time.ago').forEach((t) => {
    t.lastChild.nodeValue = fmtAgo(t.dataset.ts);
  });
}
setInterval(tickAgo, 60 * 1000);

/* ---------- 交互 ---------- */
function resetFilters() {
  state.q = '';
  qEl.value = '';
  state.filter = 'all';
  syncSearchUI();
  syncChips();
  render();
}

function syncSearchUI() {
  searchEl.classList.toggle('filled', !!qEl.value);
}

function syncChips() {
  chipsEl.querySelectorAll('.chip').forEach((c) => {
    c.setAttribute('aria-pressed', c.dataset.filter === state.filter ? 'true' : 'false');
  });
}

let inputTimer = null;
qEl.addEventListener('input', () => {
  syncSearchUI();
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => { state.q = qEl.value; render(); }, 60);
});
clearEl.addEventListener('click', () => { qEl.value = ''; state.q = ''; syncSearchUI(); render(); qEl.focus(); });

chipsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  state.filter = btn.dataset.filter;
  syncChips();
  render();
});

sortEl.addEventListener('change', () => { state.sort = sortEl.value; render(); });

/* 键盘：/ 聚焦搜索；↑↓ 在条目间移动；Esc 清空 */
document.addEventListener('keydown', (e) => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !inField) {
    e.preventDefault();
    qEl.focus();
    qEl.select();
    return;
  }
  if (e.key === 'Escape' && document.activeElement === qEl) {
    qEl.value = '';
    state.q = '';
    syncSearchUI();
    render();
    qEl.blur();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const items = [...box.querySelectorAll('.entry-main')];
    if (!items.length) return;
    if (!items.includes(document.activeElement) && !inField) {
      e.preventDefault();
      state.focus = e.key === 'ArrowDown' ? 0 : items.length - 1;
      items[state.focus].focus();
      return;
    }
    if (inField) return;
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const next = Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    state.focus = next;
    items[next].focus();
  }
});

/* 顶栏滚动阴影 */
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    topbar.classList.toggle('scrolled', window.scrollY > 4);
    ticking = false;
  });
}, { passive: true });

/* ---------- 启动 ---------- */
function failure(err) {
  box.textContent = '';
  countEl.textContent = '—';
  const s = make('div', 'state');
  const reason = err && /HTTP 403/.test(err.message)
    ? 'GitHub API 请求受限，请稍后重试'
    : '仓库列表加载失败（' + (err && err.message ? err.message : '未知错误') + '）';
  s.appendChild(make('span', '', reason));
  const btn = make('button', '', '重试');
  btn.type = 'button';
  btn.addEventListener('click', () => start(true));
  s.appendChild(btn);
  box.appendChild(s);
}

async function start(force) {
  setLink('wait');
  const cached = force ? null : readCache();
  if (cached && cached.length) {
    state.repos = cached;
    stats(cached);
    render();
  } else {
    skeletons(4);
    countEl.textContent = '加载中';
  }
  try {
    const repos = mergeExtra(await fetchRepos());
    state.repos = repos;
    writeCache(repos);
    stats(repos);
    render();
    setLink('ok');
  } catch (err) {
    setLink('err');
    if (cached) { toast('刷新失败，正在展示缓存'); return; }
    if (typeof SNAPSHOT !== 'undefined' && SNAPSHOT.length) {
      state.repos = mergeExtra(SNAPSHOT);
      stats(state.repos);
      render();
      toast('GitHub 接口受限，展示最近一次同步的仓库列表');
      return;
    }
    failure(err);
  }
}

start(false);

/* 长时间停留时定期重拉，避免时间和列表停在打开页时的旧值 */
let lastFetch = Date.now();
async function refresh() {
  if (document.hidden) return;
  if (Date.now() - lastFetch < 60 * 1000) return;   // 防抖，避免频繁切标签耗尽接口配额
  lastFetch = Date.now();
  try {
    const repos = mergeExtra(await fetchRepos());
    const sig = (list) => list.map((r) => r.name + ':' + r.pushed_at).join('|');
    if (sig(repos) === sig(state.repos)) { state.repos = repos; writeCache(repos); return; }
    state.repos = repos;
    writeCache(repos);
    stats(repos);
    render();
    setLink('ok');
  } catch (e) { /* 静默失败：保留当前列表 */ }
}
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
