<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>rdtscx</title>
<style>
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --panel2:#fbfcfd;
  --line:#e6e9ef;
  --line2:#eef1f5;
  --text:#1e2733;
  --muted:#5f6b7a;
  --dim:#8d97a5;
  --accent:#3f6fd8;
  --accent-soft:#eef3fd;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --topbar-h:53px;
}
*{box-sizing:border-box}
html{color-scheme:light;scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + 12px)}
body{
  margin:0;line-height:1.62;color:var(--text);background:var(--bg);
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;display:grid;place-items:center;letter-spacing:.5px;border:1px solid #dbe6fa;flex-shrink:0}
.brand strong{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;color:var(--dim);font-size:10.5px}

/* layout */
.wrap{max-width:1320px;margin:0 auto;padding:20px 22px 56px}
a{color:inherit}

/* hero */
.hero{border:1px solid var(--line);border-radius:14px;padding:24px 26px;background:var(--panel)}
.eyebrow{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.hero h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.hero-sub{margin:8px 0 0;font-size:12px;line-height:1.7;color:var(--muted);max-width:56ch}

/* section head */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.sec-head h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.005em}
.sec-head span{font-size:10.5px;color:var(--dim);font-family:var(--mono)}

/* index */
.index{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(31,45,66,.03)}
.entry{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:14px 18px;border-top:1px solid var(--line2);text-decoration:none;
  transition:background .12s;
}
.entry:first-child{border-top:0}
.entry:hover{background:var(--panel2)}
.entry:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.entry-main{min-width:0;display:block}
.entry-title{display:block;font-size:14.5px;font-weight:600;color:var(--text);letter-spacing:.005em;word-break:break-word}
.entry-desc{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;
}
.entry-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tag{font-size:9.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.path{
  font-family:var(--mono);font-size:10.5px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;
}
.chev{width:7px;height:7px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg);margin:0 5px;transition:transform .2s,border-color .2s;flex-shrink:0}
.entry:hover .chev{transform:rotate(45deg) translate(2px,-2px);border-color:var(--accent)}

/* states */
.state{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:18px;color:var(--dim);font-size:12px}
.state button{
  font:inherit;font-size:11.5px;color:#354356;background:#fff;
  border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.state button:hover{border-color:#c9d3e2;color:#16202c;background:#fbfcfe}
.note{margin:8px 0 0;font-size:10.5px;color:var(--dim)}

/* footer */
footer{color:var(--dim);font-size:10.5px;margin-top:28px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:3px 0}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--accent);border-bottom-color:#c7d7f2}

@media (min-width:1500px){
  .topbar-inner,.wrap{max-width:1440px}
}
@media (max-width:760px){
  .topbar-inner{padding:9px 12px;gap:8px}
  .brand{min-width:0}
  .brand small{display:none}
  .wrap{padding:14px 12px 44px}
  .hero{padding:18px 16px;border-radius:12px}
  .hero h1{font-size:21px}
  .entry{padding:13px 14px;gap:12px}
}
@media (max-width:560px){
  .path{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">R</span>
      <div><strong>rdtscx</strong><small>站点索引</small></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">站点根路径</span>
    <h1>rdtscx</h1>
    <p class="hero-sub">站点根路径为整体仓库部署内容。</p>
  </section>

  <div class="sec-head">
    <h2>仓库索引</h2>
    <span id="repo-count">加载中</span>
  </div>

  <div class="index" id="repo-index"></div>
  <noscript><div class="state">仓库索引需要启用 JavaScript，可直接访问 <a href="https://github.com/rdtscx?tab=repositories">GitHub 仓库列表</a>。</div></noscript>
  <p class="note">列表由 GitHub API 实时读取，仓库新增或删除后刷新页面即同步；启用 Pages 的仓库指向其站点路径，其余指向 GitHub 仓库页。</p>

  <footer>
    <p>rdtscx · GitHub Pages 静态站点</p>
    <p>仓库：<a href="https://github.com/rdtscx/rdtscx.github.io">github.com/rdtscx/rdtscx.github.io</a></p>
  </footer>
</main>

<script>
(() => {
'use strict';

const USER = 'rdtscx';
const ENDPOINT = 'https://api.github.com/users/' + USER + '/repos?per_page=100&sort=pushed';
const box = document.getElementById('repo-index');
const count = document.getElementById('repo-count');

const make = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

const nextUrl = (link) => {
  if (!link) return null;
  const m = link.match(/<([^>]+)>\s*;\s*rel="next"/);
  return m ? m[1] : null;
};

async function load() {
  const repos = [];
  let url = ENDPOINT;
  for (let page = 0; url && page < 10; page++) {
    const res = await fetch(url, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const batch = await res.json();
    if (!Array.isArray(batch)) throw new Error('响应格式异常');
    repos.push(...batch);
    url = nextUrl(res.headers.get('Link'));
  }
  return repos;
}

function linkFor(repo) {
  if (repo.has_pages) {
    return { href: '/' + encodeURIComponent(repo.name) + '/', path: '/' + repo.name + '/' };
  }
  return { href: repo.html_url, path: 'github.com/' + USER + '/' + repo.name };
}

function entry(repo) {
  const target = linkFor(repo);
  const a = make('a', 'entry');
  a.href = target.href;

  const main = make('span', 'entry-main');
  main.appendChild(make('span', 'entry-title', repo.name));
  main.appendChild(make('span', 'entry-desc', repo.description || '暂无描述'));
  a.appendChild(main);

  const right = make('span', 'entry-right');
  if (repo.fork) right.appendChild(make('span', 'tag', 'Fork'));
  if (repo.archived) right.appendChild(make('span', 'tag', '已归档'));
  const path = make('code', 'path', target.path);
  path.title = target.href;
  right.appendChild(path);
  right.appendChild(make('i', 'chev'));
  a.appendChild(right);
  return a;
}

function render(repos) {
  box.textContent = '';
  count.textContent = repos.length + ' 个';
  if (!repos.length) {
    box.appendChild(make('div', 'state', '没有可展示的公开仓库'));
    return;
  }
  repos.forEach((repo) => box.appendChild(entry(repo)));
}

function fail(err) {
  box.textContent = '';
  count.textContent = '—';
  const state = make('div', 'state');
  const reason = err && err.message === 'HTTP 403'
    ? 'GitHub API 请求受限，请稍后重试'
    : '仓库列表加载失败（' + (err && err.message ? err.message : '未知错误') + '）';
  state.appendChild(make('span', '', reason));
  const retry = make('button', '', '重试');
  retry.type = 'button';
  retry.addEventListener('click', run);
  state.appendChild(retry);
  box.appendChild(state);
}

async function run() {
  box.textContent = '';
  count.textContent = '加载中';
  box.appendChild(make('div', 'state', '正在读取仓库列表…'));
  try {
    const all = await load();
    const repos = all.filter((repo) => repo.name.toLowerCase() !== USER + '.github.io');
    repos.sort((a, b) => String(b.pushed_at || '').localeCompare(String(a.pushed_at || '')));
    render(repos);
  } catch (err) {
    fail(err);
  }
}

run();
})();
</script>
</body>
</html>
