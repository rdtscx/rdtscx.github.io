name: 同步根站数据

on:
  schedule:
    # 北京时间 08:00 / 20:00（UTC 00:00 / 12:00）
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rootsite
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 拉取仓库与 Releases，注入页面
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync.py

      - name: 提交变更
        run: |
          if git diff --quiet -- index.html; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "同步根站数据：$(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
